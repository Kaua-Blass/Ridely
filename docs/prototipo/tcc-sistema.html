<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0c1524;--card:#121e33;--ink:#e8eef9;--mut:#8da0bb;--line:#223253;--pri:#6b9cf5;--pri2:#1a2c4f;--ok:#143327;--okt:#6fd3a4;--warn:#3a1c20;--warnt:#f19a98;--amb:#3a2d12;--ambt:#f0c46a}

.aviso{padding:12px 0;border-bottom:1px solid var(--line)}.aviso:last-child{border:0}.aviso p{margin:4px 0 0;color:var(--mut)}.aviso .h{display:flex;gap:10px;justify-content:space-between}

@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:12px}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}main{padding:18px 14px}.filt{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
/* ===== Utilidades ===== */
const HOJE='2026-10-12',$=s=>document.querySelector(s),D=s=>new Date(s+'T12:00:00'),br=s=>D(s).toLocaleDateString('pt-BR'),R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const add=(s,n)=>{const x=D(s);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},DS=['dom','seg','ter','qua','qui','sex','sáb'],wd=s=>D(s).getDay(),dia=s=>DS[wd(s)]+' '+D(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),dd=s=>Math.ceil((D(s)-D(HOJE))/864e5);

const sub=(k,l)=>S.sub[k]||l[0];

 $('#frm').onsubmit=e=>{e.preventDefault();const v={};cs.forEach(c=>{const el=$('#f_'+c.k);v[c.k]=c.t=='file'?(el.files[0]?.name||''):el.value});$('#dlg').close();ok(v)};$('#dlg').showModal()}

/* ===== Dados de demonstração (trocar por API) ===== */
const P={valorDia:50,multa:5}; // R$ por dia contratado/mês; multa de 5% (sem juros)

const ROTAS={1:{n:'Rota 1 · direta',d:'Para somente na última parada.',p:[2]},2:{n:'Rota 2 · com paradas',d:'Passa por todas as paradas.',p:[0,1,2]}};

const fims={1:'2026-12-18',2:'2026-11-20',3:'2026-12-18',4:'2026-12-18',5:'2026-10-30',6:'2026-12-18'};

const nome=id=>assoc.find(a=>a.id==id)?.nome||'—',ct=a=>contratos.find(c=>c.a==a),val=a=>(ct(a)?.dias.length||0)*P.valorDia;

mov({d:'2026-10-05',c:2,k:'despesa',cat:'Combustível',h:'Abastecimento das vans',v:640});mov({d:'2026-10-08',c:1,k:'despesa',cat:'Manutenção',h:'Troca de pneus Van 2',v:180});
const saldo=c=>c.ini+movs.filter(m=>m.c==c.id).reduce((s,m)=>s+(m.k=='receita'||m.k=='tin'?m.v:-m.v),0);
let res=[[1,'2026-10-13',1],[3,'2026-10-13',1],[6,'2026-10-13',1],[2,'2026-10-13',2],[5,'2026-10-13',2],[1,'2026-10-14',1],[5,'2026-10-14',2],[2,'2026-10-12',2],[4,'2026-10-12',2],[5,'2026-10-12',2]].map((x,i)=>({id:i+1,a:x[0],d:x[1],r:x[2],s:'confirmada'}));
let avisos=[{id:1,tipo:'Aviso',t:'Reunião ordinária',x:'Assembleia na sede, sexta-feira às 19h. Pauta: renovação de contratos.',d:'2026-10-08',para:null},{id:2,tipo:'Rota',t:'Rota 2 · desvio na ponte',x:'A partir de segunda o ônibus passa pela Av. Brasil antes da Praça. Horário mantido.',d:'2026-10-09',para:null},{id:3,tipo:'Cobrança',t:'Mensalidades em aberto',x:'Constam mensalidades vencidas. Valores na aba Financeiro.',d:'2026-10-11',para:4}];

/* ===== Perfis ===== */
const S={u:null,tela:'painel',sub:{},f:{q:'',ref:'',st:'',conta:''},lv:{d:HOJE,r:1}};
const TELAS={painel:'Painel',associados:'Associados',rotas:'Veículos e rotas',financeiro:'Financeiro',controles:'Controles financeiros',contratos:'Contratos',transporte:'Transporte',comunicacao:'Comunicação',relatorios:'Relatórios',admin:'Administração'};
const ACC={presidente:Object.keys(TELAS),tesoureiro:['painel','associados','rotas','financeiro','controles','contratos','comunicacao','relatorios'],associado:['painel','financeiro','contratos','transporte','comunicacao'],motorista:['painel','transporte','rotas']};
const W={associados:['presidente'],financeiro:['presidente','tesoureiro'],controles:['presidente','tesoureiro'],contratos:['presidente'],comunicacao:['presidente','tesoureiro'],admin:['presidente']},can=t=>(W[t]||[]).includes(S.u.p);

/* ===== Telas ===== */
const V={};
V.painel=()=>{const p=S.u.p,l=avisos.filter(a=>p=='presidente'||p=='tesoureiro'||a.para==null||a.para==S.u.a).sort((a,b)=>b.id-a.id).slice(0,3);let s;

 else if(p=='associado'){const o=mens.filter(m=>m.a==S.u.a&&!m.pago),c=ct(S.u.a);s=[[R(o.reduce((x,m)=>x+m.valor+multa(m),0)),'em aberto'],[res.filter(x=>x.a==S.u.a&&x.d>HOJE&&x.s=='confirmada').length,'viagens reservadas'],[c?br(c.fim):'—','fim do contrato']]}
 else s=[1,2].map(r=>[ocup(HOJE,r)+' de '+cap(r),'passageiros hoje · '+ROTAS[r].n]);
 return cab('Olá, '+S.u.n.split(' ')[0],'Hoje é '+br(HOJE)+'.')+`<div class="stats">${s.map(x=>`<div class="card stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><div class="card"><h2>Avisos recentes</h2>${lista(l)}</div>`};
V.associados=()=>cab('Associados','Cada associado é também o estudante atendido. Cargos não concedem acesso ao sistema.',can('associados')?'<button class="btn" onclick="novoAssoc()">Novo associado</button>':'')+`<div class="card">${T(['Nome','Cargo','Escola','Rota','Ponto de embarque','Contrato'],assoc.map(a=>[a.nome,tag(a.cargo,a.cargo=='Associado'?'n':''),a.escola,ROTAS[a.rota].n,PARADAS[a.ponto],ct(a.id)?ct(a.id).dias.length+' dias/sem':tag('Sem contrato','amb')]))}</div>`;
V.rotas=()=>cab('Veículos e rotas','Duas rotas, três paradas.')+`<div class="cols" style="margin-bottom:16px">${[1,2].map(r=>`<div class="card"><h2>${ROTAS[r].n}</h2><p class="nota">${ROTAS[r].d}</p>${PARADAS.map((p,i)=>`<div style="padding:5px 0;${ROTAS[r].p.includes(i)?'':'color:var(--mut);text-decoration:line-through'}">${i+1}. ${p}${i==2?' (última)':''}</div>`).join('')}</div>`).join('')}</div><div class="card">${T(['Veículo','Placa','Capacidade','Rota','Motorista'],VEIC.map(v=>[v.n,v.placa,v.cap+' lugares',ROTAS[v.rota].n,v.mot]))}</div>`;
function mensTab(){const me=S.u.p=='associado',F=S.f;const l=mens.filter(m=>(!me||m.a==S.u.a)&&(!F.q||nome(m.a).toLowerCase().includes(F.q.toLowerCase()))&&(!F.ref||m.ref==F.ref)&&(!F.st||st(m)==F.st)).sort((a,b)=>!!a.pago-!!b.pago||D(a.venc)-D(b.venc));
 return T(['Associado','Referência','Vencimento','Valor','Multa 5%','Status',''],l.map(m=>[nome(m.a),mes(m.ref),br(m.venc),R(m.valor),multa(m)?R(multa(m)):'—',stTag(m),!m.pago&&can('financeiro')?`<button class="btn sm" onclick="baixa('${m.id}')">Dar baixa</button>`:m.pago&&can('financeiro')?`<button class="btn s sm" onclick="toast('Recibo gerado (PDF virá com o back-end)')">Recibo</button>`:'']))}
V.financeiro=()=>{const me=S.u.p=='associado',F=S.f,w=can('financeiro');
 let h=cab('Financeiro',me?'Suas mensalidades e pendências.':'Mensalidades, baixas e inadimplência.',w?'<button class="btn s" onclick="gerarMes()">Gerar mensalidades de nov/2026</button><button class="btn s" onclick="cobrar()">Notificar atrasados</button>':'');
 if(me){const c=ct(S.u.a);h+=`<p class="nota">Valor fixo de ${R(P.valorDia)} por dia contratado: ${c?c.dias.length+' dias = '+R(val(S.u.a)):'sem contrato'}. Atraso: multa de ${P.multa}%, sem juros.</p>`}

function novaMov(k){const cats=k=='receita'?['Contribuição extraordinária','Taxa administrativa','Outras receitas']:['Combustível','Manutenção','Seguro','Outras despesas'];form(k=='receita'?'Nova receita':'Nova despesa',[{k:'d',l:'Data',t:'date',d:HOJE},{k:'cat',l:'Categoria',t:'select',o:cats},{k:'h',l:'Descrição'},{k:'v',l:'Valor (R$)',t:'number'},{k:'c',l:k=='receita'?'Conta de destino':'Conta de origem',t:'select',o:cOpts()}],v=>{const x=+v.v,c=contas.find(y=>y.id==v.c);if(!(x>0)||!v.h)return toast('Informe descrição e valor');if(k=='despesa'&&x>saldo(c))return toast('Saldo insuficiente em '+c.nome);mov({d:v.d,c:c.id,k,cat:v.cat,h:v.h,v:x});log(`${k=='receita'?'Receita':'Despesa'} ${R(x)} · ${v.h}`);toast('Registrado');draw()})}

function params(){form('Parâmetros',[{k:'v',l:'Valor por dia contratado (R$)',t:'number',d:P.valorDia},{k:'m',l:'Multa por atraso (%)',t:'number',d:P.multa}],v=>{P.valorDia=+v.v;P.multa=+v.m;log('Parâmetros alterados');toast('Parâmetros salvos. Valem para novas mensalidades.');draw()})}
function conta(){form('Criar conta',[{k:'n',l:'Nome completo'},{k:'e',l:'E-mail',t:'email'},{k:'c',l:'CPF'},{k:'t',l:'Telefone'}],v=>{if(!v.n||!v.e)return toast('Informe nome e e-mail');sols.push({id:sols.length+1,tipo:'Associação',nome:v.n,email:v.e,st:'pendente'});toast('Conta criada. A presidência analisará seu pedido de associação.')},'Solicitar')}

 return cab('Relatórios','Transferências entre contas não entram em receitas e despesas.')+`<div class="card"><div class="bar"><h2 style="margin:0">Inadimplência</h2><input style="width:220px" placeholder="Buscar associado" value="${F.rq||''}" onchange="S.f.rq=this.value;draw()"></div>${TS('inad',[['Associado',x=>nome(x.a)],['Parcelas atrasadas',x=>x.q],['Total com multa',x=>x.v]],li,x=>[nome(x.a),x.q,R(x.v)])}</div>
 <div class="card"><div class="bar"><h2 style="margin:0">Fluxo de caixa</h2><div><input type="month" style="width:auto" value="${F.rm||''}" onchange="S.f.rm=this.value;draw()"><button class="btn s" onclick="S.f.rm='';draw()">Todos os meses</button></div></div>${TS('fluxo',[['Mês/ano',x=>x.k],['Entradas',x=>x.e],['Saídas',x=>x.s],['Resultado',x=>x.e-x.s]],lf,x=>[mes(x.k),R(x.e),R(x.s),R(x.e-x.s)])}</div>
 <div class="card"><h2>Contratos próximos do vencimento</h2>${T(['Associado','Fim','Situação'],contratos.filter(c=>dd(c.fim)<=60).map(c=>[nome(c.a),br(c.fim),ctSt(c)]))}</div>`};

/* perfil */
V.perfil=()=>{const u=S.u,a=assoc.find(x=>x.id==u.a);return cab('Meu perfil','Seus dados de contato e acesso.')+`<div class="card"><div style="display:flex;gap:16px;align-items:center;margin-bottom:16px">${av(u,64)}<div><b>${u.n}</b><p class="nota" style="margin:0">Perfil de acesso: ${u.p}${a?' · cargo: '+a.cargo:''}</p></div></div><div class="cols">${fld('Foto de perfil','pf','','file').replace('type="file"','type="file" accept="image/*"')}${fld('Nome','pn',u.n)}${fld('E-mail','pe',u.e,'email')}${fld('Telefone','pt',u.tel)}${a?instSel(a.inst):''}${fld('Endereço','pd',u.end)}${fld('Contato de emergência','pm',u.emerg)}</div><p class="nota" style="margin-top:12px">Com o back-end, a troca de e-mail será confirmada por link enviado ao novo endereço.</p><div class="acts" style="justify-content:flex-start"><button class="btn" onclick="salvarPerfil()">Salvar dados</button><button class="btn s" onclick="senha()">Alterar senha</button></div></div>`};
function salvarPerfil(){const u=S.u,f=$('#pf').files[0],g=()=>{u.n=$('#pn').value||u.n;u.e=$('#pe').value||u.e;u.tel=$('#pt').value;u.end=$('#pd').value;u.emerg=$('#pm').value;const a=assoc.find(x=>x.id==u.a);if(a){a.nome=u.n;a.tel=u.tel;a.email=u.e;a.inst=$('#pi').value;a.rota=rotaAuto(a.pt,a.inst)}log('Perfil atualizado');toast('Dados salvos');draw()};if(f){const r=new FileReader();r.onload=()=>{u.foto=r.result;g()};r.readAsDataURL(f)}else g()}
function senha(){form('Alterar senha',[{k:'a',l:'Senha atual',t:'password'},{k:'n',l:'Nova senha (mínimo 8 caracteres)',t:'password'},{k:'c',l:'Confirmar nova senha',t:'password'}],v=>{if(v.a!=S.u.senha)return toast('Senha atual incorreta');if(v.n.length<8)return toast('A nova senha precisa ter 8 ou mais caracteres');if(v.n!=v.c)return toast('A confirmação não confere');S.u.senha=v.n;log('Senha alterada');toast('Senha alterada')},'Alterar')}

/* login e estrutura */
function entrar(){const e=$('#em').value.trim().toLowerCase(),s=$('#pw').value,u=usuarios.find(x=>x.e.toLowerCase()==e&&x.senha==s&&x.on);if(!u)return toast('E-mail ou senha inválidos');S.u=u;S.tela='painel';draw()}
function draw(){
 if(!S.u){$('#root').innerHTML=`<div class="login"><div class="card"><div class="logo" style="padding-bottom:6px"><i style="background:var(--panel);color:#fff">TCC</i>Transporte Escolar</div><p class="nota">Acesse com seu e-mail e senha.</p>${fld('E-mail','em','','email')}<div style="height:8px"></div>${fld('Senha','pw','','password')}<button class="btn" style="margin-top:14px" onclick="entrar()">Entrar</button><button class="btn s" onclick="concluir()">Tenho um convite</button><button class="btn s" onclick="conta()">Criar conta e pedir para ser associado</button></div></div>`;$('#pw').onkeydown=e=>{if(e.key=='Enter')entrar()};return}
 const ac=ACC[S.u.p];if(!ac.includes(S.tela))S.tela='painel';
 $('#root').innerHTML=`<div class="app"><aside><div class="logo"><i>TCC</i>Transporte Escolar</div><nav>${ac.map(t=>`<button class="${t==S.tela?'on':''}" onclick="S.tela='${t}';draw()">${TELAS[t]}</button>`).join('')}</nav><div class="me"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">${av(S.u)}<b>${S.u.n}</b></div>Perfil: ${S.u.p}<br><button class="btn s sm" style="margin-top:8px" onclick="S.u=null;draw()">Sair</button></div></aside><main>${V[S.tela]()}</main></div>`;
}

/* ===== Ajustes v4 ===== */
const PERFIS=['presidente','vice-presidente','tesoureiro','conselheiro','auxiliar','associado','motorista'];
const PERFIL_CARGO={'Associado':'associado','Presidente':'presidente','Vice-presidente':'vice-presidente','Tesoureiro':'tesoureiro','Conselheiro':'conselheiro','Auxiliar':'auxiliar'};
ACC['vice-presidente']=Object.keys(TELAS).filter(t=>t!='admin');
ACC.conselheiro=['painel','associados','rotas','financeiro','controles','contratos','comunicacao','relatorios','perfil'];
ACC.auxiliar=['painel','associados','rotas','transporte','comunicacao','perfil'];
['associados','contratos','comunicacao','rotas'].forEach(k=>W[k].push('vice-presidente'));
const _vp2=V.painel;V.painel=()=>{const p=S.u.p;if(p=='vice-presidente'||p=='conselheiro'){let h;S.u.p='tesoureiro';try{h=_vp2()}finally{S.u.p=p}return h+alertaH()}return _vp2()};
const instSel=v=>`<div><label class="nota" style="display:block;margin-bottom:4px" for="pi">Instituição</label><select id="pi">${INSTS().map(i=>`<option${i==v?' selected':''}>${i}</option>`).join('')}</select></div>`;

/* formulários em colunas quando há 5 ou mais campos */
function form(t,cs,ok,rot='Salvar'){const g=cs.length>=5;$('#dlg').style.width=g?'min(700px,94vw)':'';
 $('#frm').innerHTML=`<h2>${t}</h2><div style="${g?'display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px':''}">`+cs.map(c=>`<div${c.t=='area'?' style="grid-column:1/-1"':''}><label for="f_${c.k}">${c.l}</label>`+(c.t=='select'?`<select id="f_${c.k}">${c.o.map(o=>`<option value="${o.v??o}"${(o.v??o)==c.d?' selected':''}>${o.n??o}</option>`).join('')}</select>`:c.t=='area'?`<textarea id="f_${c.k}" rows="3">${c.d??''}</textarea>`:`<input id="f_${c.k}" type="${c.t||'text'}" ${c.t=='file'?'accept="application/pdf"':''} value="${c.d??''}">`)+'</div>').join('')+`</div><div class="acts"><button type="button" class="btn s" onclick="$('#dlg').close()">Cancelar</button><button class="btn">${rot}</button></div>`;
 $('#frm').onsubmit=e=>{e.preventDefault();const v={};cs.forEach(c=>{const el=$('#f_'+c.k);v[c.k]=c.t=='file'?(el.files[0]?.name||''):el.value});$('#dlg').close();ok(v)};$('#dlg').showModal()}

/* convite: perfil de acesso sugerido pelo cargo */
function convidar(){form('Convidar associado',[{k:'n',l:'Nome completo'},{k:'e',l:'E-mail do convite',t:'email'},{k:'c',l:'Cargo',t:'select',o:Object.keys(PERFIL_CARGO)},{k:'p',l:'Perfil de acesso (sugerido pelo cargo, pode ajustar)',t:'select',o:PERFIS.filter(x=>x!='motorista'),d:'associado'},{k:'i',l:'Instituição',t:'select',o:INSTS()}],v=>{if(!v.n||!v.e)return toast('Informe nome e e-mail');if(assoc.some(a=>a.email==v.e))return toast('Esse e-mail já foi convidado');const r=rotaAuto(null,v.i);assoc.push({id:assoc.length+1,nome:v.n,cargo:v.c,inst:v.i,rota:r,pt:ROTAS[r].par[0],ponto:0,tel:'—',email:v.e,conv:1,perfil:v.p});log('Convite enviado a '+v.e);toast('Convite enviado a '+v.e+' com link para concluir o cadastro');draw()},'Enviar convite');$('#f_c').onchange=()=>{$('#f_p').value=PERFIL_CARGO[$('#f_c').value]}}

/* criar conta e aprovação, agora com instituição e senha */
function conta(){form('Criar conta',[{k:'n',l:'Nome completo'},{k:'e',l:'E-mail',t:'email'},{k:'c',l:'CPF'},{k:'t',l:'Telefone'},{k:'i',l:'Instituição',t:'select',o:INSTS()},{k:'s',l:'Senha (mínimo 8 caracteres)',t:'password'}],v=>{if(!v.n||!v.e)return toast('Informe nome e e-mail');if(v.s.length<8)return toast('Senha muito curta');sols.push({id:Math.max(0,...sols.map(x=>x.id))+1,tipo:'Associação',nome:v.n,email:v.e,inst:v.i,tel:v.t,senha:v.s,st:'pendente'});toast('Conta criada. A presidência analisará seu pedido de associação.')},'Solicitar')}
function decide(id,ok){const s=sols.find(x=>x.id==id);s.st=ok?'aprovada':'rejeitada';if(ok&&s.tipo=='Associação'){const r=rotaAuto(null,s.inst),i=assoc.length+1;assoc.push({id:i,nome:s.nome,cargo:'Associado',inst:s.inst,rota:r,pt:ROTAS[r].par[0],ponto:0,tel:s.tel||'—',email:s.email});usuarios.push({n:s.nome,e:s.email,p:'associado',on:1,senha:s.senha,a:i,tel:s.tel||'',foto:'',end:'',emerg:''})}if(ok&&s.tipo!='Associação'){const c=ct(s.a);c.dias=PRE[s.pre];c.adit++}log((ok?'Aprovada: ':'Rejeitada: ')+s.tipo);toast(ok?'Aprovada':'Rejeitada');draw()}

draw();
</script>
</body>
</html>
