services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ridely
      POSTGRES_PASSWORD: ridely
      POSTGRES_DB: ridely
    ports: ["5432:5432"]
    volumes:
      - dados:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
volumes:
  dados:
